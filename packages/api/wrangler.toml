name = "sao-jorge-api"
main = "src/index.ts"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
TZ = "America/Sao_Paulo"
ACCESS_TEAM_DOMAIN = "talles-f1e.cloudflareaccess.com"
ACCESS_AUDIENCE = "SET_IN_ENVIRONMENT"
ACCESS_ADMIN_ROLE = "parish-admin"
ACCESS_ADMIN_EMAILS = "talles@oliceu.com"

# ── D1 Database ────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "sao-jorge-db"
database_id = "839dd3d0-71ad-4cc7-b3c6-4aa606dcc2c1"

# ── KV Namespaces ──────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "DAY_CACHE"
id = "db0694d53c494194a1a817f9bf6924f8"
preview_id = "29b65473140b417cb473496d45141a0d"

# ── R2 Buckets ─────────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sao-jorge-media"

# ── Cron Triggers ─────────────────────────────────────────────────────────────
[triggers]
crons = ["0 3 * * *"]

# ── Workers AI ──────────────────────────────────────────────────────────────
[ai]
binding = "AI"

# ── Secrets (set via: wrangler secret put SECRET_NAME) ───────────────────────
# Access JWT validation uses ACCESS_TEAM_DOMAIN and ACCESS_AUDIENCE above.
# RESEND_KEY  — Resend API key for email notifications (optional)
# ADMIN_EMAIL — Timon's email for review notifications

# ── Staging environment ───────────────────────────────────────────────────────
# Keep staging resources separate from production. Replace the placeholders
# before applying this environment; never point staging at the production D1/KV.
[env.staging]
name = "sao-jorge-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
TZ = "America/Sao_Paulo"
ACCESS_TEAM_DOMAIN = "talles-f1e.cloudflareaccess.com"
ACCESS_AUDIENCE = "72dcbad3a679fdd341564c4d511c578a5995a70eb2fbf10d1a4842d3a637fa33"
ACCESS_ADMIN_ROLE = "parish-admin"
ACCESS_ADMIN_EMAILS = "talles@oliceu.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "sao-jorge-db-staging"
database_id = "7eaa48d0-d656-45c0-bb53-3b0b3614e373"

[[env.staging.kv_namespaces]]
binding = "DAY_CACHE"
id = "f150e61742e84400b59f58a09407d652"
preview_id = "e6de79a85a5d4143a9af7a3b031fd4d4"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "sao-jorge-media-staging"

[env.staging.triggers]
crons = []

[env.staging.ai]
binding = "AI"

# ── Local development environment ─────────────────────────────────────────────
[env.dev]
name = "sao-jorge-api-dev"

[env.dev.vars]
ENVIRONMENT = "development"
ACCESS_TEAM_DOMAIN = "YOUR-TEAM.cloudflareaccess.com"
ACCESS_AUDIENCE = "SET_IN_ENVIRONMENT"
ACCESS_ADMIN_ROLE = "parish-admin"

