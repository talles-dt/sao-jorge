name: Deploy All (Pages + Workers)

on:
  push:
    branches: [main]

jobs:
  deploy-pages:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Pages dependencies
        run: |
          cd nextjs
          npm ci

      - name: Build Next.js app
        run: |
          cd nextjs
          npm run pages:build

      - name: List deployment files
        run: |
          cd nextjs
          ls -la .open-next/

      - name: Install wrangler
        run: |
          cd nextjs
          npm install -g wrangler@latest

      - name: Create _redirects file
        run: |
          cd nextjs
          echo "/* /index.html 200" > .open-next/_redirects

      - name: Deploy to Cloudflare Pages
        run: |
          cd nextjs
          npx wrangler pages deploy .open-next --project-name=sao-jorge --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    needs: deploy-pages
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Workers dependencies
        run: |
          cd workers
          npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: workers
